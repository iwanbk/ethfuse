linters:
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - revive
    - goimports
  disable:
    - errcheck

linters-settings:
  govet:
    enable-all: true
  goimports:
    local-prefixes: github.com/iwanbk/ethfuse
  revive:
    rules:
      - name: package-comments
        disabled: true

issues:
  exclude-use-default: false

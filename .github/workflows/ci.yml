name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check gofmt
        run: test -z "$(gofmt -l .)"

      - name: go mod tidy
        run: |
          go mod tidy
          # Check if go.sum exists before diffing
          if [ -f go.sum ]; then
            git diff --exit-code go.mod go.sum
          else
            echo "go.sum not present (no dependencies yet)"
            git diff --exit-code go.mod
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          $(go env GOPATH)/bin/golangci-lint version
          $(go env GOPATH)/bin/golangci-lint run

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # GO-2026-4923: bbolt v1.4.3 — no upstream fix available yet.
          KNOWN_VULNS="GO-2026-4923 GO-2026-4947 GO-2026-4946 GO-2026-4870"
          govulncheck ./... 2>&1 | tee /tmp/vuln.txt || true
          # Extract all vuln IDs from output, filter out known ones.
          unknown=$(grep -oE 'GO-[0-9]{4}-[0-9]+' /tmp/vuln.txt | grep -vF "$KNOWN_VULNS" | sort -u)
          if [ -n "$unknown" ]; then
            echo "ERROR: unexpected vulnerabilities found: $unknown"
            exit 1
          fi
          echo "govulncheck: only known/unfixable vulnerabilities ($KNOWN_VULNS)"
